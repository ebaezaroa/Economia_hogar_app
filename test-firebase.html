<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Test Firebase</title></head>
<body style="font-family:sans-serif;padding:20px;max-width:400px;">
<h2>Test Firebase</h2>
<div id="status" style="padding:10px;background:#eee;margin-bottom:10px;">Cargando...</div>
<button onclick="testRead()">1. Leer Firebase</button>
<button onclick="testWrite()">2. Escribir test</button>
<button onclick="testRead()">3. Leer de nuevo</button>
<pre id="output" style="background:#f0f0f0;padding:10px;margin-top:10px;font-size:12px;overflow:auto;"></pre>

<script>
const FB = 'https://casa-ef-default-rtdb.firebaseio.com';

async function testRead() {
  document.getElementById('status').textContent = 'Leyendo...';
  try {
    const r = await fetch(FB + '/casaEF/updatedAt.json');
    const data = await r.json();
    document.getElementById('status').textContent = 'READ OK - Status: ' + r.status;
    document.getElementById('output').textContent = 'updatedAt: ' + data + '\n' + new Date(data).toLocaleString();
  } catch(e) {
    document.getElementById('status').textContent = 'READ ERROR: ' + e.message;
  }
}

async function testWrite() {
  document.getElementById('status').textContent = 'Escribiendo...';
  const ts = Date.now();
  try {
    const r = await fetch(FB + '/casaEF/testWrite.json', {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({value: 'test_' + ts, ts: ts})
    });
    const data = await r.json();
    document.getElementById('status').textContent = 'WRITE ' + (r.ok ? 'OK' : 'FAILED') + ' - Status: ' + r.status;
    document.getElementById('output').textContent = JSON.stringify(data, null, 2);
  } catch(e) {
    document.getElementById('status').textContent = 'WRITE ERROR: ' + e.message;
  }
}

testRead();
</script>
</body>
</html>
